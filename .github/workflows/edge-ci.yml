name: Edge CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: edge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  WINDOWS_NODE_VERSION: '24.15.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: edge / linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install pinned standalone assembly dependencies
        run: pnpm --dir apps/dsh-edge/standalone install --frozen-lockfile

      # Run before the repository install so a parent dependency cannot mask a
      # missing package in the standalone lock.
      - name: Build the pinned standalone release artifacts
        run: pnpm --dir apps/dsh-edge/standalone run build

      - name: Verify the standalone release contract
        run: pnpm --dir apps/dsh-edge/standalone run verify

      - name: Promote standalone artifacts to release paths
        run: node apps/dsh-edge/standalone/scripts/promote.mjs all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation
        run: pnpm run doc-sync

      - name: Lint Edge-owned source
        run: pnpm run lint

      - name: Test Edge runtime, client plugin, and repository contracts
        run: pnpm run test

      - name: Test review state sensor
        run: bash .agents/skills/codex-review-loop/tests/codex-state.test.sh

      - name: Test released artifacts and 0.1.3 durable state in both modes
        run: node apps/dsh-edge/tests/run-session-integration.mjs

      - name: Type-check Edge-owned source
        run: pnpm run typecheck

      - name: Snapshot the assembled Edge runtime and browser path
        env:
          # ubuntu-latest includes Google Chrome; avoid downloading a second
          # browser and mutating the hosted image with apt on every run.
          DSH_EDGE_PLAYWRIGHT_CHANNEL: chrome
        run: pnpm --filter dsh-edge run test:snapshot

      # pnpm pack runs dsh-edge's prepack gate, which builds both runtime modes
      # and size-checks Direct. Separate bundle steps would repeat that work.
      - name: Pack the public installer
        run: pnpm --dir apps/dsh-edge pack --pack-destination "${{ runner.temp }}"

      - name: Verify the installed package outside the workspace
        run: pnpm --filter dsh-edge run pack:verify "${{ runner.temp }}/dsh-edge-$(node -p "require('./apps/dsh-edge/package.json').version").tgz"

  windows-installer:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: edge / windows installer
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          # Node 24.16+ can abort Windows file watchers when runner temp uses
          # an 8.3 short path. Match the release verifier until Node ships
          # https://github.com/nodejs/node/pull/65118.
          node-version: ${{ env.WINDOWS_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows installer security and lifecycle
        run: pnpm exec vitest run --project edge-runtime apps/dsh-edge/tests/installer.spec.ts

  container-image:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: edge / container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # Same platform and manifest shape as the release job; never pushed.
      - name: Build the Container image
        uses: docker/build-push-action@v7
        with:
          context: apps/dsh-edge/container
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: dsh-edge-computer:ci

      - name: Check the Linux toolchain
        run: docker run --rm --entrypoint sh dsh-edge-computer:ci -c 'node -v && python3 --version && git --version && rg --version'

      # Without /dev/fuse computerd falls back to its userspace shim, which is
      # enough to prove the daemon starts and serves its readiness route.
      - name: Check that computerd serves health
        run: |
          docker run -d --name computerd -p 8080:8080 dsh-edge-computer:ci
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null -I http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs computerd
          exit 1

  verify:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [linux, windows-installer, container-image]
    name: edge / verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require Linux, Windows, and Container image verification
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows-installer.result }}
          CONTAINER_RESULT: ${{ needs.container-image.result }}
        run: |
          test "$LINUX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$CONTAINER_RESULT" = success
