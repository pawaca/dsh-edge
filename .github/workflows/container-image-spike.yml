# TEMPORARY: pushes a spike tag to validate Docker Hub pulls from Cloudflare.
# Removed before this branch's pull request is opened.
name: Container image spike

on:
  push:
    branches: [feat/container-image]
    paths: ['.github/workflows/container-image-spike.yml', 'apps/dsh-edge/container/**']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/dsh-edge/container
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: docker.io/pawaca/dsh-edge-computer:spike-${{ github.sha }}
      - run: echo "digest=${{ steps.build.outputs.digest }}"
